<style>
:root{color-scheme:light;--b:#0a4fc4;--bg:#f4f7fc;--c:#fff;--t:#0f1b33;--m:#66728a;--bo:#dfe6f2;--ok:#16a34a;--w:#d97706;--e:#dc2626}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{position:sticky;top:0;z-index:5;background:#fff;color:#0a3a8c;border-bottom:1px solid var(--bo);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
header img{width:34px;height:34px}header b{flex:1}header small{opacity:.8}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--c);border-top:1px solid var(--bo);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--m);padding:6px 4px;border-radius:12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav .on{color:var(--b);background:#e8f0fd}
@media(min-width:900px){nav{left:50%;right:auto;width:33.333vw;min-width:480px;transform:translateX(-50%);border:1px solid var(--bo);border-bottom:0;border-radius:16px 16px 0 0}}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px;margin:10px 0 4px}.bars i{flex:1;background:var(--b);border-radius:3px 3px 0 0;min-height:2px}.bar{height:6px;border-radius:3px;background:var(--b);margin-top:3px}ul{padding-left:18px;margin:6px 0}summary{cursor:pointer;font-weight:700;padding:4px 0}details details summary{font-weight:600}
.tk{display:flex;gap:10px;align-items:flex-start;padding:10px 10px 10px 12px;border:1px solid var(--bo);border-radius:12px;margin-top:8px;background:var(--c);cursor:pointer}.tk:hover{border-color:var(--b)}
.tk input{width:22px;height:22px;margin:2px 0 0;flex:none}.tk .f{flex:1;min-width:0}.tk.today{border-color:var(--b);background:#eef4ff}.tk.done .tt{text-decoration:line-through;color:var(--m)}
.dy{font-size:12px;color:var(--m);font-weight:600;flex:1}.tt{display:block;font-size:15px;margin-top:2px}.pv{font-size:13px;color:var(--m);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed{flex:none;border:1px solid var(--bo);background:none;border-radius:9px;padding:7px;cursor:pointer;color:var(--b);line-height:0}.ed:hover{background:#e8f0fd}.ed svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
details>summary{list-style-position:inside}details details{border-top:1px solid var(--bo);padding-top:6px}textarea{resize:vertical}
main{max-width:980px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--c);border:1px solid var(--bo);border-radius:12px;padding:12px;margin-bottom:10px}
.k{font-size:12px;color:var(--m)}.v{font-size:20px;font-weight:700;margin-top:2px}.m{color:var(--m)}
.btn{border:0;background:var(--b);color:#fff;padding:9px 14px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:none;color:var(--b);border:1px solid var(--b)}.btn.d{background:var(--e)}.btn.x{padding:6px 10px;font-size:13px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bo);border-radius:9px;background:var(--c);color:var(--t);font:inherit;margin:3px 0 10px}
label{font-size:12px;color:var(--m)}.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.r>.f{flex:1;min-width:0}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700;background:var(--bo)}
.baru{background:#dbeafe;color:#1e40af}.dikemas{background:#fef3c7;color:#92400e}.dikirim{background:#e0e7ff;color:#3730a3}.selesai{background:#dcfce7;color:#166534}.retur,.batal{background:#fee2e2;color:#991b1b}
table{width:100%;border-collapse:collapse}td,th{padding:7px 4px;text-align:left;border-bottom:1px solid var(--bo)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.chips button{white-space:nowrap}
.auth{max-width:360px;margin:8vh auto;padding:20px;text-align:center}.auth img{width:84px}.err{color:var(--e);font-size:13px}.ctr{text-align:center;padding:40px}
.pi{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--bo)}
dialog{border:0;border-radius:14px;padding:16px;width:min(480px,94vw);background:var(--c);color:var(--t);max-height:90vh}dialog::backdrop{background:#0008}
</style></head><body><div id="app"><p class="ctr">Memuat…</p></div><dialog id="dlg"></dialog>

 edit(n){const e=E(n),ok=(S.rm.done||{})[n];
  dlg.innerHTML=`<form onsubmit="A.saveEd(event,${n})"><h3 style=margin-top:0>Edit Day ${n} · ${dt(n)}</h3><label>Judul tugas (kosongkan untuk judul bawaan)</label><input name=ti value="${h(e.title)}" placeholder="${h(task(n))}"><label>Informasi / catatan</label><textarea name=inf rows=3>${h(e.info)}</textarea><label>Output / hasil</label><textarea name=out rows=3 placeholder="mis. 10 kompetitor tercatat, margin rata-rata 25%">${h(e.out)}</textarea>
  <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--t)"><input type=checkbox name=dn ${ok?'checked':''} style="width:20px;height:20px;margin:0"> Tugas selesai</label><div class=r style=margin-top:12px><button class=btn>Simpan</button><button type=button class="btn s" onclick="A.view(${n})">Batal</button></div></form>`;dlg.open||(dlg.open||dlg.showModal())},
 async saveEd(ev,n){ev.preventDefault();const f=ev.target.elements,d={title:f.ti.value.trim(),info:f.inf.value.trim(),out:f.out.value.trim(),at:Date.now(),by:S.u.email},ok=f.dn.checked;
  S.rm.edits={...(S.rm.edits||{}),[n]:d};S.rm.done={...(S.rm.done||{}),[n]:ok};A.view(n);
  try{await setDoc(doc(db,'plan','roadmap'),{edits:{[n]:d},done:{[n]:ok}},{merge:true})}catch(x){alert(msg(x))}},
 op(k,v){S.op[k]=v},
 start(pick){let t=new Date();if(pick){const v=prompt('Tanggal mulai Day 1 (YYYY-MM-DD):',t.toISOString().slice(0,10));if(!v)return;const m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return alert('Format salah');t=new Date(+m[1],m[2]-1,+m[3])}
  setDoc(doc(db,'plan','roadmap'),{start:new Date(t.getFullYear(),t.getMonth(),t.getDate()).getTime()},{merge:true}).catch(e=>alert(msg(e)))},
 swot(){const c=S.sw?.cur||{},f=(k,l,p)=>`<label>${l}</label><textarea name=${k} rows=3 placeholder="${p}">${h(c[k])}</textarea>`;
  dlg.innerHTML=`<form onsubmit="A.saveSw(event)"><h3>Analisis SWOT</h3>${f('s','Strengths (kekuatan)','mis. harga lebih murah tanpa sewa toko, stok gudang sendiri')}${f('w','Weaknesses (kelemahan)','mis. modal terbatas, belum punya brand')}${f('o','Opportunities (peluang)','mis. belanja online tumbuh, promo marketplace')}${f('t','Threats (ancaman)','mis. perang harga, perubahan biaya admin')}<p class=k>Tersimpan juga sebagai snapshot Day ${Math.max(1,curDay())}.</p><div class=r><button class=btn>Simpan</button><button type=button class="btn s" onclick="dlg.close()">Tutup</button></div></form>`;(dlg.open||dlg.showModal())},
 async saveSw(e){e.preventDefault();const f=e.target.elements,cur={s:f.s.value,w:f.w.value,o:f.o.value,t:f.t.value};
  try{await setDoc(doc(db,'plan','swot'),{cur,snaps:{['d'+Math.max(1,curDay())]:{...cur,at:Date.now()}}},{merge:true});dlg.close();draw()}catch(x){alert(msg(x))}},
 snap(d){const c=S.sw.snaps['d'+d],q=[['s','Strengths'],['w','Weaknesses'],['o','Opportunities'],['t','Threats']];dlg.innerHTML=`<h3>SWOT · Day ${d}</h3>${q.map(([k,l])=>`<p><b>${l}</b><br>${h(c[k]||'-').replace(/\n/g,'<br>')}</p>`).join('')}<button class=btn onclick="dlg.close()">Tutup</button>`;(dlg.open||dlg.showModal())},
 role:(id,r)=>updateDoc(doc(db,'users',id),{role:r}).catch(e=>alert(e.message)),
 formP(id){const p=S.products.find(x=>x.id===id)||{};dlg.innerHTML=`<form onsubmit="A.saveP(event)"><h3>${id?'Edit':'Tambah'} produk</h3><input type=hidden name=pid value="${id||''}">
  <label>SKU</label><input name=sku value="${h(p.sku)}" required><label>Nama produk</label><input name=nm value="${h(p.name)}" required>
  <div class=r><div class=f><label>HPP (modal)</label><input name=cost type=number min=0 value="${p.cost??''}" required></div><div class=f><label>Harga jual</label><input name=price type=number min=0 value="${p.price??''}" required></div></div>
  <div class=r><div class=f><label>${id?'Stok (ubah via +Stok)':'Stok awal'}</label><input name=stock type=number min=0 value="${p.stock??0}" ${id?'disabled':''}></div><div class=f><label>Batas stok menipis</label><input name=min type=number min=0 value="${p.min??5}"></div></div>
  <label>Foto (opsional → Firebase Storage)</label><input name=img type=file accept=image/*><div class=r><button class=btn>Simpan</button><button type=button class="btn s" onclick="dlg.close()">Batal</button></div></form>`;(dlg.open||dlg.showModal())},
 async saveP(e){e.preventDefault();const f=e.target.elements,id=f.pid.value,d={sku:f.sku.value.trim().toUpperCase(),name:f.nm.value.trim(),cost:+f.cost.value||0,price:+f.price.value||0,min:+f.min.value||0};
  const btn=e.target.querySelector('.btn');btn.disabled=true;
  try{if(f.img.files[0]){const u=await up(f.img.files[0]);if(u)d.img=u}
   if(id)await updateDoc(doc(db,'products',id),d);else{d.stock=+f.stock.value||0;d.createdAt=serverTimestamp();const r=await addDoc(collection(db,'products'),d);if(d.stock){const b=writeBatch(db);b.set(doc(collection(db,'moves')),{pid:r.id,name:d.name,qty:d.stock,note:'Stok awal',by:S.u.email,at:serverTimestamp()});await b.commit()}}
   dlg.close();draw()}catch(x){alert(x.message);btn.disabled=false}},
 async add(id){const p=S.products.find(x=>x.id===id),q=parseInt(prompt(`Stok masuk / koreksi untuk ${p.name} (negatif = kurangi):`,'10'));if(!q)return;const n=prompt('Catatan (mis. PO supplier):','Barang masuk gudang')||'';const b=writeBatch(db);mv(b,p,q,n);b.commit().catch(e=>alert(e.message))},
 async delP(id){if(confirm('Hapus produk ini?'))deleteDoc(doc(db,'products',id)).catch(e=>alert(e.message))},
 newO(){if(!S.products.length)return alert('Tambahkan produk dulu.');dlg.innerHTML=`<form onsubmit="A.saveO(event)"><h3>Pesanan marketplace</h3><label>Marketplace</label><select name=mp onchange="this.form.elements.fee.value=this.selectedOptions[0].dataset.f">${MP.map(([k,f])=>`<option data-f=${f}>${k}</option>`).join('')}</select>
  <label>No. pesanan marketplace</label><input name=no required><label>Nama pembeli</label><input name=cust required><label>Ekspedisi marketplace</label><select name=courier>${CR.map(c=>`<option>${c}</option>`).join('')}</select>
  <label>Produk</label><div id=rows>${rowH()}</div><button type=button class="btn x s" onclick="$('#rows').insertAdjacentHTML('beforeend',A.rowH())">+ Produk</button>
  <p><label>Biaya admin marketplace (%)</label><input name=fee type=number step=.1 min=0 value=8></p><div class=r><button class=btn>Simpan</button><button type=button class="btn s" onclick="dlg.close()">Batal</button></div></form>`;(dlg.open||dlg.showModal())},rowH,
 pick(s){const r=s.closest('.row');r.querySelector('.pr').value=s.selectedOptions[0].dataset.p||''},
 async saveO(e){e.preventDefault();const f=e.target.elements,items=[...e.target.querySelectorAll('.row')].map(r=>{const p=S.products.find(x=>x.id===r.querySelector('select').value);return p&&{pid:p.id,sku:p.sku,name:p.name,qty:+r.querySelector('.q').value||1,price:+r.querySelector('.pr').value||0,cost:p.cost||0}}).filter(Boolean);
  if(!items.length)return alert('Pilih minimal 1 produk');const total=sum(items,i=>i.qty*i.price);
  try{await addDoc(collection(db,'orders'),{no:f.no.value.trim(),mp:f.mp.value,courier:f.courier.value,customer:f.cust.value.trim(),items,total,fee:Math.round(total*(+f.fee.value||0)/100),status:'baru',resi:'',createdAt:serverTimestamp(),by:S.u.email});dlg.close();draw()}catch(x){alert(x.message)}},
 async setS(id,s){const o=S.orders.find(x=>x.id===id),b=writeBatch(db),u={status:s};
  if(s==='dikemas'){for(const i of o.items){const p=S.products.find(x=>x.id===i.pid);if(!p||p.stock<i.qty)return alert(`Stok ${i.name} tidak cukup (${p?p.stock:0})`)}o.items.forEach(i=>mv(b,i,-i.qty,'Pesanan '+o.no))}
  if(s==='dikirim'){const r=prompt('Nomor resi ekspedisi:');if(!r)return;u.resi=r.trim()}
  if(['retur','batal'].includes(s)){if(!confirm(`Tandai ${s}?`))return;if(['dikemas','dikirim'].includes(o.status))o.items.forEach(i=>mv(b,i,i.qty,`${s} ${o.no}`))}
  b.update(doc(db,'orders',id),u);b.commit().catch(e=>alert(e.message))}};
dlg.addEventListener('close',()=>draw());
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));
</script></body></html>
